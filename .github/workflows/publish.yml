name: F45 Boramae Threads Publish

on:
  push:
    branches: [main]
    paths:
      - "queue/**.txt"
  workflow_dispatch:

concurrency:
  group: f45-boramae-threads-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: threads-publish
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 큐에 쌓인 새 게시물 발행
        id: publish
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          set -e
          files=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'queue/*.txt' 2>/dev/null || true)
          if [ -z "$files" ]; then
            files=$(ls queue/*.txt 2>/dev/null || true)
          fi
          for f in $files; do
            echo "발행 중: $f"
            python scripts/publish_threads.py "$f"
            mkdir -p queue/published
            git mv "$f" "queue/published/$(basename "$f")"
          done

      - name: 발행 상태 커밋
        if: always()
        run: |
          git config user.name "f45-boramae-threads-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark queued posts as published [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push 재시도 $i"
              sleep 5
            done
          fi

      - name: 결과 알림 (ntfy)
        if: always()
        run: |
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            curl -s -H "Title: F45 보라매 Threads 발행 성공" -H "Tags: white_check_mark" \
              -d "새 게시물이 Threads에 발행됐습니다" \
              https://ntfy.sh/f45-boramae-threads-bot-9f3c21 || true
          else
            curl -s -H "Title: F45 보라매 Threads 발행 실패" -H "Priority: high" -H "Tags: x" \
              -d "확인 필요: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              https://ntfy.sh/f45-boramae-threads-bot-9f3c21 || true
          fi
